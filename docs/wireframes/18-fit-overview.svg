  <text x="216" y="108" font-size="12" text-anchor="start" font-weight="normal" fill="#777777">SOP 01 市場定位：客群輪廓 × 商品 × 團主的適配評估，供 G1 選品核准查閱</text>
  <rect x="216" y="124" width="960" height="50" rx="4" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="1"/>
  <text x="230" y="146" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">評分設定 v1：建議值，待 Owner 確認。權重 需求 30%、品類 20%、價格 15%、歷史績效 20%、供應履約 15%；</text>
  <text x="230" y="164" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">建議合作 ≥ 80 分、需人工評估 ≥ 65 分。　調整設定（僅管理者／營運主管）</text>
