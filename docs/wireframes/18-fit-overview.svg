  <text x="976.0" y="733.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">建立客群分析</text>
  <text x="230" y="834" font-size="11" text-anchor="start" font-weight="normal" fill="#777777">評分的資料來源：客群分析（人工填寫，標示事實／估計）、訂單歸因（歷史績效）、出貨與售後案件（供應履約）、商品資料。預設只評估狀態為「合作中」的團主。</text>
  <text x="230" y="854" font-size="11" text-anchor="start" font-weight="normal" fill="#777777">權限：fit.read（管理者、營運主管、營運小編）；覆核需 fit.review；調整設定需 fit.config。團主、廠商、財務看不到此頁與導覽項。</text>
