<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <title>登入</title>
  <rect x="0" y="0" width="1200" height="800" rx="0" fill="#f4f4f4" stroke="none" stroke-width="1"/>
  <rect x="420" y="170" width="360" height="400" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="600" y="220" font-size="20" text-anchor="middle" font-weight="bold" fill="#333333">招財兔團購營運系統</text>
  <text x="600" y="245" font-size="12" text-anchor="middle" font-weight="normal" fill="#777777">請使用公司帳號登入</text>
  <text x="450" y="285" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">Email</text>
  <rect x="450" y="290" width="300" height="30" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  <text x="458" y="309.0" font-size="12" text-anchor="start" font-weight="normal" fill="#888888">name@company</text>
  <text x="450" y="355" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">密碼</text>
  <rect x="450" y="360" width="300" height="30" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
  <text x="458" y="379.0" font-size="12" text-anchor="start" font-weight="normal" fill="#888888">••••••••</text>
  <rect x="450" y="420" width="300" height="36" rx="5" fill="#4a4a4a" stroke="#6b6b6b" stroke-width="1"/>
  <text x="600.0" y="442.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#ffffff">登入</text>
  <rect x="450" y="470" width="300" height="40" rx="4" fill="#efefef" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="460" y="495" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">帳號或密碼錯誤（錯誤時顯示）</text>
  <text x="600" y="545" font-size="11" text-anchor="middle" font-weight="normal" fill="#888888">登入失敗多次會暫時鎖定帳號</text>
  <circle cx="410" cy="170" r="11" fill="#111111"/><text x="410" y="174" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
  <circle cx="440" cy="290" r="11" fill="#111111"/><text x="440" y="294" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
  <circle cx="440" cy="360" r="11" fill="#111111"/><text x="440" y="364" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
  <circle cx="440" cy="420" r="11" fill="#111111"/><text x="440" y="424" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
  <circle cx="440" cy="470" r="11" fill="#111111"/><text x="440" y="474" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
</svg>
