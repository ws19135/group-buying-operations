  <text x="764" y="474.0" font-size="11" text-anchor="start" font-weight="bold" fill="#333333">狀態</text>
  <text x="874" y="474.0" font-size="11" text-anchor="start" font-weight="bold" fill="#333333">決定／完成</text>
  <text x="1064" y="474.0" font-size="11" text-anchor="start" font-weight="bold" fill="#333333"></text>
  <line x1="226" y1="488" x2="1166" y2="488" stroke="#bdbdbd"/>
  <text x="234" y="510.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">RFD-…</text>
  <text x="364" y="510.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">NT$ …</text>
  <text x="484" y="510.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">〔原因〕</text>
  <text x="764" y="510.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">待核准</text>
  <rect x="874" y="503.0" width="95" height="8" rx="3" fill="#d9d9d9"/>
  <rect x="1064" y="503.0" width="55" height="8" rx="3" fill="#d9d9d9"/>
  <line x1="226" y1="524" x2="1166" y2="524" stroke="#bdbdbd"/>
  <text x="234" y="546.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">RFD-…</text>
  <text x="364" y="546.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">NT$ …</text>
  <text x="484" y="546.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">〔原因〕</text>
  <text x="764" y="546.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">待完成</text>
  <text x="874" y="546.0" font-size="11" text-anchor="start" font-weight="normal" fill="#666666">核准者／日期</text>
  <rect x="1064" y="539.0" width="55" height="8" rx="3" fill="#d9d9d9"/>
  <line x1="226" y1="560" x2="1166" y2="560" stroke="#bdbdbd"/>
  <rect x="234" y="575.0" width="78" height="8" rx="3" fill="#d9d9d9"/>
  <rect x="364" y="575.0" width="60" height="8" rx="3" fill="#d9d9d9"/>
  <rect x="484" y="575.0" width="140" height="8" rx="3" fill="#d9d9d9"/>
