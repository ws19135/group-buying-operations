  <rect x="858" y="66" width="110" height="28" rx="5" fill="#ffffff" stroke="#b00020" stroke-width="1"/>
  <text x="913.0" y="84.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#b00020">取消案件</text>
  <rect x="216" y="120" width="470" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
