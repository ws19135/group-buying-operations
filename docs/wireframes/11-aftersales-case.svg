  <text x="230" y="430" font-size="14" text-anchor="start" font-weight="bold" fill="#333333">退款申請</text>
  <line x1="216" y1="440" x2="1176" y2="440" stroke="#bdbdbd"/>
  <rect x="1010" y="412" width="156" height="24" rx="5" fill="#4a4a4a" stroke="#6b6b6b" stroke-width="1"/>
  <text x="1088.0" y="428.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#ffffff">＋ 申請退款</text>
