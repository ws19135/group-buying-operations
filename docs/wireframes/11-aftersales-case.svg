  <text x="24" y="520" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">自動化</text>
  <text x="24" y="546" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">稽核</text>
  <rect x="200" y="0" width="1000" height="48" rx="0" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="216" y="30" font-size="12" text-anchor="start" font-weight="normal" fill="#777777">營運 / 售後 / CAS-…</text>
  <rect x="950" y="12" width="24" height="24" rx="12" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="962" y="29" font-size="11" text-anchor="middle" font-weight="normal" fill="#333333">🔔</text>
