  <rect x="874" y="575.0" width="95" height="8" rx="3" fill="#d9d9d9"/>
  <rect x="1064" y="575.0" width="55" height="8" rx="3" fill="#d9d9d9"/>
  <rect x="226" y="452" width="940" height="144" rx="0" fill="none" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="1060" y="488" width="50" height="22" rx="5" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
  <text x="1085.0" y="503.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">核准</text>
  <rect x="1114" y="488" width="50" height="22" rx="5" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
  <text x="1139.0" y="503.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">退回</text>
  <rect x="1050" y="524" width="114" height="22" rx="5" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
  <text x="1107.0" y="539.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">完成退款</text>
  <rect x="226" y="600" width="940" height="110" rx="4" fill="#ececec" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="240" y="628" font-size="12" text-anchor="start" font-weight="bold" fill="#333333">完成退款對話框（財務）：</text>
  <rect x="240" y="640" width="16" height="16" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="264" y="653" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">同時寫回訂單退款金額（預設不勾；寫回不可超過訂單金額，並在同一交易內更新訂單狀態）</text>
  <text x="240" y="686" font-size="11" text-anchor="start" font-weight="normal" fill="#777777">提醒：若退款已由訂單匯入反映，請不要勾選，避免重複</text>
