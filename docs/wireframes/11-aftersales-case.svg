  <text x="24" y="342" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">社群</text>
  <text x="24" y="368" font-size="12" text-anchor="start" font-weight="normal" fill="#333333">商品</text>
  <text x="18" y="398" font-size="10" text-anchor="start" font-weight="normal" fill="#888888">財務</text>
