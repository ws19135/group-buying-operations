  <text x="232" y="192" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">到期日</text>
  <rect x="330" y="184" width="200" height="8" rx="3" fill="#d9d9d9"/>
  <text x="232" y="218" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">負責人</text>
  <rect x="330" y="210" width="240" height="8" rx="3" fill="#d9d9d9"/>
  <text x="232" y="244" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">買家代號</text>
