  <text x="232" y="322" font-size="12" text-anchor="start" font-weight="normal" fill="#666666">處理結果</text>
  <rect x="330" y="314" width="160" height="8" rx="3" fill="#d9d9d9"/>
  <text x="232" y="360" font-size="11" text-anchor="start" font-weight="normal" fill="#b00020">請勿填寫姓名、電話、地址（僅用去識別化代號）</text>
  <rect x="706" y="120" width="470" height="270" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
  <text x="720" y="144" font-size="14" text-anchor="start" font-weight="bold" fill="#333333">處理紀錄</text>
  <line x1="706" y1="154" x2="1176" y2="154" stroke="#bdbdbd"/>
  <rect x="1030" y="126" width="136" height="24" rx="5" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
  <text x="1098.0" y="142.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#333333">＋ 新增備註</text>
