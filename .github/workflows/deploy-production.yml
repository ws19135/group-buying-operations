name: Deploy (staging / production)

# 部署：**只能手動觸發**（workflow_dispatch）。target 選 staging（預備環境）或 production（正式環境），各自綁定同名的 GitHub Environment——
# 請在 Repository Settings → Environments 建立 staging 與 production，並替 production 設定 Required reviewers（Owner 核准後才會執行）。
# 每個 Environment 各有自己的 Secrets 與 Variable（兩個環境的主機、金鑰、網址互相獨立）。
# 流程：確認該 commit 的 CI 全綠 → 建置並推送映像 → 同步 compose／Caddyfile／主機腳本到 DEPLOY_PATH → 主機端 deploy-remote.sh（拉映像、確認已初次建置、部署前備份、migration、啟動、就緒檢查）。
# 建議順序：先部署 staging、跑完 Live UAT，再部署 production。
# 沒有設定主機 Secrets 時，只會建置並推送映像（不會部署）。部署紀錄保存為 artifact；回滾見 docs/ROLLBACK_PLAN.md。
# 所需 Secrets（均不得出現在程式或文件中）：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY、DEPLOY_PATH（主機上 docker-compose.prod.yml 所在目錄）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的 Git ref（預設 main）；回滾時填舊的 commit／tag'
        required: false
        default: main
      target:
        description: '部署目標（預設 staging；正式環境請在 staging 驗收通過後再選 production）'
        type: choice
        options: [staging, production]
        default: staging
      checklist_confirmed:
        description: '【production 必填】我確認已依 docs/OWNER_SETUP_CHECKLIST.md 步驟 1～8 設置完成（選 yes）'
        type: choice
        options: ['no', 'yes']
        default: 'no'
      staging_verified:
        description: '【production 必填】我確認 staging 已通過 Live UAT 與備份還原演練（選 yes）'
        type: choice
        options: ['no', 'yes']
        default: 'no'
      image_tag:
        description: '回滾用：直接指定已存在的映像 tag（填了就不重新建置）'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: 正式建置前詢問 — 是否已依 OWNER_SETUP_CHECKLIST 設置
        run: |
          if [ "${{ inputs.target }}" = production ]; then
            if [ "${{ inputs.checklist_confirmed }}" != yes ] || [ "${{ inputs.staging_verified }}" != yes ]; then
              {
                echo "### ⛔ 已停止：正式環境部署前需要先確認"
                echo "請重新執行 workflow，並在兩個確認欄位選 yes 之前，先確認："
                echo "1. 已依 \`docs/OWNER_SETUP_CHECKLIST.md\` 步驟 1～8 設置完成（主機、DNS、SSH 金鑰、Environments／Secrets、ghcr 登入、.env.production、初次建置）"
                echo "2. staging 已通過 Live UAT 與備份還原演練"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo "target=${{ inputs.target }}：確認欄位檢查通過"
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - id: meta
        run: |
          sha="$(git rev-parse HEAD)"; tag="${{ inputs.image_tag }}"; [ -n "$tag" ] || tag="$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Gate — CI must be green on this commit
        if: ${{ inputs.image_tag == '' }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          state="$(gh api repos/${{ github.repository }}/commits/${{ steps.meta.outputs.sha }}/check-runs --jq '[.check_runs[] | select(.name=="verify") | .conclusion] | if length==0 then "none" elif all(.=="success") then "success" else "fail" end')"
          echo "CI state: $state"; [ "$state" = "success" ] || { echo "此 commit 的 CI 尚未全部成功，拒絕部署"; exit 1; }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and push image
        if: ${{ inputs.image_tag == '' }}
        run: |
          docker build --build-arg BUILD_SHA=${{ steps.meta.outputs.sha }} --build-arg APP_VERSION=${{ steps.meta.outputs.sha }} -t "$IMAGE:${{ steps.meta.outputs.tag }}" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
      - name: Deploy over SSH (only when host secrets are configured)
        id: ssh
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
          P: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$K" ] || [ -z "$P" ]; then echo "deployed=false" >> "$GITHUB_OUTPUT"; echo "尚未設定 ${{ inputs.target }} 的主機 Secrets：只建置映像，沒有部署。" | tee deploy-log.txt; exit 0; fi
          install -m 600 /dev/null key; printf '%s\n' "$K" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new"
          # 設定檔以 commit 為準（compose／Caddyfile／主機腳本）；.env.production 只存在主機，不會被覆蓋
          $SSH "$U@$H" "mkdir -p '$P/deploy'"
          scp -i key -o StrictHostKeyChecking=accept-new docker-compose.prod.yml deploy/host-common.sh deploy/deploy-remote.sh deploy/host-backup.sh deploy/host-restore-drill.sh "$U@$H:$P/"
          scp -i key -o StrictHostKeyChecking=accept-new deploy/Caddyfile "$U@$H:$P/deploy/Caddyfile"
          $SSH "$U@$H" "chmod +x '$P'/*.sh && CONFIRM_CHECKLIST=yes '$P/deploy-remote.sh' '$IMAGE:${{ steps.meta.outputs.tag }}'" | tee deploy-log.txt
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Post-deploy readiness check (public HTTPS URL)
        if: steps.ssh.outputs.deployed == 'true'
        run: |
          : "${{ vars.ERP_URL }}"; url="${{ vars.ERP_URL }}"
          for i in $(seq 1 30); do curl -fsS "$url/api/ready" | tee -a deploy-log.txt && break; sleep 5; done
          curl -fsS "$url/api/health" | tee -a deploy-log.txt
      - name: Deploy log
        if: always()
        run: |
          { echo "target=${{ inputs.target }} ref=${{ inputs.ref }} commit=${{ steps.meta.outputs.sha }} tag=${{ steps.meta.outputs.tag }} actor=${{ github.actor }} run=${{ github.run_id }} time=$(date -u +%FT%TZ)"; } >> deploy-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'deploy-log-${{ inputs.target }}', path: deploy-log.txt }
